以 BM25 与 BGE-M3 双路召回并融合排序，检索已通过来源校验的论文信息卡。信息卡记录论文中的事实、观点、方法或规范线索，属于学术材料候选，不等于现行法律。需要法律结论时仍须调用法规工具；需要案件事实时仍须调用案例工具。查询应简短明确，回查来源标题、路径、定位和时间语境；若 method=bm25 且 status=partial，须如实说明语义检索不可用。
"""
