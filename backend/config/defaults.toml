联网搜索公开网页，只返回候选来源、标题、摘要、网址、日期和权威性等级。query必填且不超过128个字符，可使用site:和引号等搜索语法。搜索结果只用于发现来源，不等于已经读过正文；要把来源作为研究证据，必须把返回的url交给web_read。优先搜索官方机构、法规原文、学术出版物和公开数据源；不要把摘要直接写成已经核实的事实。每个运行最多调用本工具4次，已有结果足够时停止。
"""
read_description = """
读取一个公开HTTP或HTTPS网页的Markdown正文。url应来自web_search或用户明确提供；返回标题、正文、抓取时间、正文SHA-256、字符范围和是否截断。正文才是可进入证据矩阵的联网材料，仍需区分原文事实、作者观点和模型推断。搜索摘要不能替代正文；正文被截断时不要声称已经覆盖全文。每个运行最多调用本工具4次。
"""

