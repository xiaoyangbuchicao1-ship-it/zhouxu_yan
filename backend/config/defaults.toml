按 card_id 读取信息卡完整记录和来源定位。source_path 是原文来源定位，不是当前工作区文件；不要用工作区 read 读取它。信息卡只能证明该卡记录的论文材料，不得直接写成现行法、法院认定或现实数据；需要这些结论时继续核对法规库、案例库或外部原文。
"""
capability_select_description = """
按用户研究问题选择候选能力卡。能力卡只规定研究动作顺序、证据要求和停止条件，不提供法条结论，也不能替代法规、案例或论文原文。没有明确触发条件时返回空候选，不强行套用。
"""
capability_read_description = """
读取候选能力卡的触发条件、研究步骤、证据要求和停止条件。把它作为科研流程参考，不能把卡片内容当作法律证据或最终论文事实。
"""
paper_compile_description = """
使用已注册 csl-law-paper-generator Skill 的固定编译脚本，把当前运行工作区内的 .typ 源稿编译成 PDF 和 Word。只接受当前运行工作区的相对路径，不接受宿主机绝对路径；编译失败直接返回错误，不生成伪造交付物。
"""

