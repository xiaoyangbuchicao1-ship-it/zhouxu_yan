# Public model catalog.  This file intentionally contains no credentials.
# Relay model names were observed from its /v1/models response on 2026-11-21.

[providers.deepseek]
label = "DeepSeek"
protocol = "deepseek_chat_completions"
endpoint = "https://api.deepseek.com/chat/completions"
credential_names = ["DEEPSEEK_API_KEY", "DEEPSEEK_KEY", "OPENAI_API_KEY", "API_KEY"]
source = "DeepSeek API documentation"

[providers.relay]
label = "其他模型"
protocol = "openai_chat_completions"
endpoint = ""
credential_names = ["ZHOUXU_RELAY_API_KEY", "RELAY_API_KEY", "OPENAI_API_KEY"]
source = "Configured relay /v1/models catalog"

[models]
deepseek = ["deepseek-flash", "deepseek-v4-pro"]
relay = [
  "claude-fable-5", "claude-fable-5-1", "claude-fable-5-2",
