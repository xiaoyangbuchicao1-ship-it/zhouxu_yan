  "claude-sonnet-4-6", "claude-sonnet-5", "claude-sonnet-5-5",
  "gemini-3.7-flash", "gemini-3.8-flash",
  "gemini-4-argon", "gemini-4-carbon", "gemini-4-hydrogen", "gemini-4-neon",
  "gpt-4o", "gpt-5.6", "gpt-5.6-luna", "gpt-5.6-sol", "gpt-5.6-terra",
  "gpt-6-astra", "gpt-6-luna", "gpt-6-sol", "gpt-6.1-sol", "gpt-6.1-terra",
  "gpt-6.2-astra", "gpt-6.2-sol", "glm-5-2-260617", "glm-5-3-flash-260828"
