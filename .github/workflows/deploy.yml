name: Build and Push ZhouXu Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'zhouxu' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push zhouxu-api
        run: |
          docker build \
            --target api \
            -f deploy/app/Dockerfile \
            -t ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-api:latest \
            -t ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-api:${{ github.sha }} \
            .
          docker push ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-api:latest
          docker push ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-api:${{ github.sha }}

      - name: Build and push zhouxu-web
        run: |
          docker build \
            --target web \
            -f deploy/app/Dockerfile \
            -t ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-web:latest \
            -t ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-web:${{ github.sha }} \
            .
          docker push ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-web:latest
          docker push ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/zhouxu-web:${{ github.sha }}
