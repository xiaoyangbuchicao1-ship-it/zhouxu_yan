name: maritime-opensearch-dev

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.0}
    container_name: maritime-opensearch-dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=maritime-law-dev
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD before starting}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../../vector_db_data/opensearch:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:19200:9200"
      - "127.0.0.1:19600:9600"
